[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "spip-backend"
version = "0.1.0"
description = "SPIP modular-monolith API foundation"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14,<2", "fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pip-audit>=2.8,<3", "pytest>=9.0.3,<10", "ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
